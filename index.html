<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="https://flaticon.com">
<title>Academic Task & Deadline Monitor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#f1f5f9;color:#1e293b;padding-bottom:2rem}
header{background:#1d4ed8;color:#fff;padding:1.1rem;text-align:center}
.wrap{max-width:800px;margin:1rem auto;padding:0 .8rem}
.alert-box{background:#fef2f2;border:1px solid #f87171;color:#991b1b;padding:.75rem;border-radius:8px;margin-bottom:1rem;font-size:.85rem;display:none}
.box{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:1rem;margin-bottom:1rem}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:.6rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:1rem;text-align:center}
.stat{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:.7rem}
label{display:block;font-size:.78rem;font-weight:700;margin-bottom:.2rem}
input,select,textarea{width:100%;padding:.5rem;border:1px solid #cbd5e1;border-radius:6px;font-size:.9rem}
.full{grid-column:1/-1}
.btn{background:#2563eb;color:#fff;border:none;border-radius:6px;padding:.65rem;width:100%;font-weight:700;margin-top:.6rem;cursor:pointer}
.btn-s{background:#e2e8f0;color:#1e293b;border:none;border-radius:5px;padding:.35rem .6rem;font-size:.78rem;font-weight:700;cursor:pointer}
.h-btns{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
.btn-notif{background:#fef3c7;color:#92400e;border:1px solid #f59e0b;border-radius:6px;padding:.45rem .75rem;font-size:.8rem;font-weight:700;cursor:pointer}
.btn-inst{background:#16a34a;color:#fff;border:none;border-radius:6px;padding:.45rem .85rem;font-size:.8rem;font-weight:700;cursor:pointer;display:none}
.task{background:#fff;border:1px solid #cbd5e1;border-left:5px solid #2563eb;border-radius:8px;padding:.85rem;margin-bottom:.7rem}
.overdue{border-left-color:#dc2626;background:#fef2f2}
.upcoming{border-left-color:#d97706}
.completed{border-left-color:#16a34a;opacity:.75}
.tag{font-size:.72rem;font-weight:700;padding:.15rem .45rem;border-radius:4px;background:#e0e7ff;color:#1e40af;margin-right:.3rem}
.cd{font-size:.78rem;font-weight:700;color:#b45309;margin-top:.25rem}
.overdue .cd{color:#dc2626}
@media(max-width:600px){.g3,.g2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h2>Academic Task & Deadline Monitor</h2>
  <small>Beleng National High School • SHS Tracker</small>
  <div class="h-btns">
    <button id="notifBtn" class="btn-notif" onclick="enableNotif()">🔔 Enable Lock Screen Alerts</button>
    <button id="instBtn" class="btn-inst" onclick="installApp()">📲 Install App</button>
  </div>
</header>

<div class="wrap">
  <div id="alertBanner" class="alert-box"></div>
  <div class="box g3">
    <div><label>Student Name</label><input id="sName" placeholder="Your Name"></div>
    <div><label>Grade</label><select id="sGrade"><option>Grade 11</option><option>Grade 12</option></select></div>
    <div><label>Strand</label><select id="sStrand"><option>ICT</option><option>HUMSS</option><option>HE</option></select></div>
  </div>
  <div class="stats">
    <div class="stat"><h3 id="cAll">0</h3><small>TOTAL</small></div>
    <div class="stat" style="color:#d97706"><h3 id="cUp">0</h3><small>UPCOMING</small></div>
    <div class="stat" style="color:#dc2626"><h3 id="cOv">0</h3><small>OVERDUE</small></div>
    <div class="stat" style="color:#16a34a"><h3 id="cOk">0</h3><small>COMPLETED</small></div>
  </div>
  <div class="box">
    <div style="display:flex;justify-content:space-between;margin-bottom:.7rem">
      <strong id="fHead">Record New Academic Task</strong>
      <button type="button" class="btn-s" onclick="sample()">+ Sample</button>
    </div>
    <form id="f">
      <input type="hidden" id="eid">
      <div class="g2">
        <div><label>Task Title *</label><input id="tT" required></div>
        <div><label>Subject *</label><input id="tS" required></div>
        <div><label>Deadline *</label><input type="datetime-local" id="tD" required></div>
        <div><label>Type</label><select id="tY"><option>Assignment</option><option>Performance Task</option><option>Project</option><option>Written Work</option></select></div>
        <div class="full"><label>Notes</label><textarea id="tN" rows="2"></textarea></div>
      </div>
      <button class="btn" id="sBtn">+ Add Task</button>
    </form>
  </div>
  <div class="box g3">
    <input id="q" placeholder="Search...">
    <select id="fs"><option value="all">All Status</option><option value="upcoming">Upcoming</option><option value="overdue">Overdue</option><option value="completed">Completed</option></select>
    <select id="fsub"><option value="all">All Subjects</option></select>
  </div>
  <div id="list"></div>
</div>

<script>
let tasks=JSON.parse(localStorage.getItem('bn_t')||'[]'),swReg=null,deferredPrompt=null;
const $=id=>document.getElementById(id);
const st=t=>t.done?'completed':(new Date(t.d)<new Date()?'overdue':'upcoming');
const save=()=>{localStorage.setItem('bn_t',JSON.stringify(tasks));draw();};

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(r=>swReg=r).catch(()=>{});
}

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;$('instBtn').style.display='inline-block';
});

function installApp(){
  if(!deferredPrompt)return alert('Tap Chrome menu (⋮) -> "Add to Home screen" or "Install app".');
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(()=>{deferredPrompt=null;$('instBtn').style.display='none';});
}

function showPush(title,body){
  if(!("Notification" in window)||Notification.permission!=='granted')return;
  if(swReg&&swReg.showNotification)swReg.showNotification(title,{body,vibrate:[200,100,200],requireInteraction:true,tag:'bn-due'});
  else try{new Notification(title,{body});}catch(e){}
}

function enableNotif(){
  if(!("Notification" in window))return alert("Browser does not support system alerts.");
  Notification.requestPermission().then(p=>{
    if(p==='granted'){
      $('notifBtn').textContent='✅ Lock Screen Alerts Active';
      showPush('Deadline Alerts Active!','Notifications will appear on your status bar & lock screen.');
    }else alert('Allow notifications in Chrome Site Settings.');
  });
}

function countdown(due,done){
  if(done)return '✓ Completed';
  const diff=new Date(due)-new Date(),abs=Math.abs(diff),mins=Math.floor(abs/6e4),hrs=Math.floor(mins/60),days=Math.floor(hrs/24);
  const txt=days>0?`${days}d ${hrs%24}h`:hrs>0?`${hrs}h ${mins%60}m`:`${mins}m`;
  return diff<0?`⚠️ Overdue by ${txt}`:`⏳ Due in ${txt}`;
}

function checkAlerts(){
  const now=new Date(),urgent=[];
  tasks.forEach(t=>{
    if(t.done)return;
    const diff=new Date(t.d)-now;
    if(diff<=864e5)urgent.push(`${t.t} (${t.s})`);
    if(diff<=0 && !t.notified){
      t.notified=true;localStorage.setItem('bn_t',JSON.stringify(tasks));
      showPush('⏰ Academic Deadline Reached!',`${t.t} (${t.s}) is now due!`);
    }
  });
  const b=$('alertBanner');
  if(urgent.length){b.style.display='block';b.innerHTML=`<strong>🔔 Urgent / Due Soon (${urgent.length}):</strong> ${urgent.join(', ')}`;}
  else b.style.display='none';
}

$('f').onsubmit=e=>{
  e.preventDefault();
  const id=$('eid').value,o={t:$('tT').value,s:$('tS').value,d:$('tD').value,y:$('tY').value,n:$('tN').value,notified:false};
  if(id){tasks=tasks.map(x=>x.id==id?{...x,...o}:x);$('eid').value='';$('fHead').textContent='Record New Academic Task';$('sBtn').textContent='+ Add Task';}
  else tasks.push({id:Date.now(),...o,done:false});
  $('f').reset();save();
};

const tog=id=>{tasks=tasks.map(x=>x.id===id?{...x,done:!x.done}:x);save();};
const del=id=>{if(confirm('Delete?')){tasks=tasks.filter(x=>x.id!==id);save();}};
const ed=id=>{const x=tasks.find(a=>a.id===id);$('eid').value=x.id;$('tT').value=x.t;$('tS').value=x.s;$('tD').value=x.d;$('tY').value=x.y;$('tN').value=x.n;$('fHead').textContent='Edit Task';$('sBtn').textContent='Update';};
const sample=()=>{const d=m=>new Date(Date.now()+m*6e4).toISOString().slice(0,16);tasks.push({id:Date.now()+1,t:'Quick Alert Demo',s:'Empowerment Tech',d:d(1),y:'Assignment',n:'Locks screen test (1 min)',done:false,notified:false});save();};

function draw(){
  const q=$('q').value.toLowerCase(),fs=$('fs').value,fsub=$('fsub').value;
  const subs=[...new Set(tasks.map(x=>x.s))];
  $('fsub').innerHTML='<option value="all">All Subjects</option>'+subs.map(s=>`<option ${s===fsub?'selected':''}>${s}</option>`).join('');
  let up=0,ov=0,ok=0;tasks.forEach(x=>{const s=st(x);s==='completed'?ok++:s==='overdue'?ov++:up++;});
  $('cAll').textContent=tasks.length;$('cUp').textContent=up;$('cOv').textContent=ov;$('cOk').textContent=ok;
  const arr=tasks.filter(x=>(fsub==='all'||x.s===fsub)&&(fs==='all'||st(x)===fs)&&(x.t+x.s+x.n).toLowerCase().includes(q)).sort((a,b)=>new Date(a.d)-new Date(b.d));
  $('list').innerHTML=arr.length?arr.map(x=>{const s=st(x);return`<div class="task ${s}"><span class="tag">${x.s}</span><span class="tag">${s.toUpperCase()}</span><small>${x.y}</small><h4 style="margin:.3rem 0">${x.t}</h4><p style="font-size:.85rem">${x.n}</p><small><b>Due:</b> ${new Date(x.d).toLocaleString()}</small><div class="cd">${countdown(x.d,x.done)}</div><div style="margin-top:.5rem;display:flex;gap:.4rem"><button class="btn-s" onclick="tog(${x.id})">${x.done?'Undo':'Done'}</button><button class="btn-s" onclick="ed(${x.id})">Edit</button><button class="btn-s" onclick="del(${x.id})">Delete</button></div></div>`;}).join(''):'<div class="box" style="text-align:center">No tasks yet.</div>';
  checkAlerts();
}
