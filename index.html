<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>Academic Task & Deadline Monitoring System</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --danger: #dc2626;
      --warning: #d97706;
      --success: #16a34a;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .container { max-width: 800px; margin: auto; }
    header { text-align: center; margin-bottom: 16px; }
    .notif-banner {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }
    .btn-notif {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      width: auto;
      white-space: nowrap;
      cursor: pointer;
    }
    .card {
      background: var(--card);
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .full-width { grid-column: span 2; }
    label { font-size: 12px; font-weight: bold; color: #475569; display: block; margin-bottom: 4px; }
    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button.btn-save {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .task-item {
      border-left: 5px solid var(--primary);
      padding: 14px;
      background: var(--card);
      border-radius: 8px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .task-item.overdue { border-left-color: var(--danger); }
    .task-item.completed { border-left-color: var(--success); opacity: 0.75; }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
      color: white;
    }
    .bg-upcoming { background-color: var(--warning); }
    .bg-overdue { background-color: var(--danger); }
    .bg-completed { background-color: var(--success); }
    .actions button {
      width: auto;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      margin-right: 5px;
    }
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .full-width { grid-column: span 1; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h2>Academic Task & Deadline Monitoring System</h2>
    <p style="margin:4px 0; font-size:14px; color:#64748b;">Beleng National High School - Senior High School</p>
  </header>

  <!-- Notification Permission Bar -->
  <div class="notif-banner" id="notifBar">
    <span>🔔 I-on ang notifications para sa lockscreen alerts.</span>
    <button class="btn-notif" onclick="requestNotifPermission()">Enable Alerts</button>
  </div>

  <!-- Add Task Form -->
  <div class="card">
    <h3 style="margin-top:0;">Add New Academic Task</h3>
    <form id="taskForm" class="form-grid">
      <div>
        <label>Task Title</label>
        <input type="text" id="taskTitle" placeholder="e.g., Research Chapter 1" required>
      </div>
      <div>
        <label>Subject</label>
        <input type="text" id="subject" placeholder="e.g., Practical Research 2" required>
      </div>
      <div>
        <label>Deadline Date & Time</label>
        <input type="datetime-local" id="deadline" required>
      </div>
      <div>
        <label>SHS Strand</label>
        <select id="strand">
          <option value="ICT">ICT Strand</option>
          <option value="HUMSS">HUMSS Strand</option>
          <option value="HE">HE Strand</option>
        </select>
      </div>
      <div class="full-width">
        <label>Description / Notes</label>
        <textarea id="description" rows="2" placeholder="Task instructions..."></textarea>
      </div>
      <button type="submit" class="btn-save full-width">Save Task</button>
    </form>
  </div>

  <!-- Filter Section -->
  <div class="filters">
    <select id="filterStatus" onchange="renderTasks()">
      <option value="ALL">All Tasks</option>
      <option value="UPCOMING">Upcoming (Pending)</option>
      <option value="OVERDUE">Overdue</option>
      <option value="COMPLETED">Completed</option>
    </select>
    <input type="text" id="searchSubject" placeholder="Filter by Subject..." onkeyup="renderTasks()">
  </div>

  <!-- Task List -->
  <div id="taskList"></div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('shsTasks')) || [];

  // Register inline Service Worker para gumana ang mobile system notifications
  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', () => self.skipWaiting());
      self.addEventListener('activate', () => self.clients.claim());
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  }

  function updateNotifBanner() {
    const bar = document.getElementById('notifBar');
    if (!('Notification' in window)) {
      bar.style.display = 'none';
    } else if (Notification.permission === 'granted') {
      bar.innerHTML = '<span>✅ Naka-on na ang Lockscreen & Status Bar Alerts.</span><button class="btn-notif" onclick="testNotification()">Test Alert</button>';
    }
  }

  function requestNotifPermission() {
    if (!('Notification' in window)) {
      alert('Hindi suportado ng browser na ito ang notifications.');
      return;
    }
    Notification.requestPermission().then(permission => {
      updateNotifBanner();
      if (permission === 'granted') {
        sendSystemNotification('Alerts Enabled!', 'Makakatanggap ka na ng notification pagsapit ng deadline.');
      }
    });
  }

  function testNotification() {
    sendSystemNotification('Test Deadline Alert', 'Ganito lalabas ang reminder sa notification bar at lockscreen mo.');
  }

  function sendSystemNotification(title, body) {
    if (Notification.permission === 'granted') {
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then(reg => {
          reg.showNotification(title, {
            body: body,
            vibrate:,
            tag: 'task-deadline'
          });
        });
      } else {
        new Notification(title, { body: body });
      }
    }
  }

  // Mag-check ng deadlines bawat 15 segundo
  setInterval(() => {
    const now = new Date();
    let updated = false;

    tasks.forEach(task => {
      if (!task.completed && !task.notified) {
        const dueDate = new Date(task.deadline);
        if (now >= dueDate) {
          sendSystemNotification(
            `⏰ Deadline Reached: ${task.title}`,
            `Subject: ${task.subject} (${task.strand}) - Due now!`
          );
          task.notified = true;
          updated = true;
        }
      }
    });

    if (updated) {
      localStorage.setItem('shsTasks', JSON.stringify(tasks));
      renderTasks();
    }
  }, 15000);

  document.getElementById('taskForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const newTask = {
      id: Date.now(),
      title: document.getElementById('taskTitle').value,
      subject: document.getElementById('subject').value,
      deadline: document.getElementById('deadline').value,
      strand: document.getElementById('strand').value,
      description: document.getElementById('description').value,
      completed: false,
      notified: false
    };

    tasks.push(newTask);
    saveAndRender();
    this.reset();
    alert('Task saved with deadline alert!');
  });

  function toggleStatus(id) {
    tasks = tasks.map(task => task.id === id ? { ...task, completed: !task.completed } : task);
    saveAndRender();
  }

  function deleteTask(id) {
    if (confirm('Delete this task?')) {
      tasks = tasks.filter(task => task.id !== id);
      saveAndRender();
    }
  }

  function saveAndRender() {
    localStorage.setItem('shsTasks', JSON.stringify(tasks));
    renderTasks();
  }

  function formatDateTime(dtString) {
    const date = new Date(dtString);
    return date.toLocaleString('en-PH', {
      month: 'short', day: 'numeric', year: 'numeric',
      hour: 'numeric', minute: '2-digit', hour12: true
    });
  }

  function renderTasks() {
    const taskList = document.getElementById('taskList');
    const filterStatus = document.getElementById('filterStatus').value;
    const searchSubject = document.getElementById('searchSubject').value.toLowerCase();
    const now = new Date();

    taskList.innerHTML = '';

    const filtered = tasks.filter(task => {
      const isOverdue = !task.completed && new Date(task.deadline) < now;
      const matchesSubject = task.subject.toLowerCase().includes(searchSubject);

      if (!matchesSubject) return false;
      if (filterStatus === 'COMPLETED') return task.completed;
      if (filterStatus === 'OVERDUE') return isOverdue;
      if (filterStatus === 'UPCOMING') return !task.completed && !isOverdue;
      return true;
    });
